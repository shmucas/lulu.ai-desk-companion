<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage {
      width: 480px;
      height: 320px;
      position: relative;
      background: #060d06;
      font-family: 'Press Start 2P', monospace;
      color: #3dff4a;
      transform-origin: center center;
    }

    /* Header bar */
    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 8px;
      color: #3dff4a;
      border-bottom: 1px solid #1a3a1a;
      z-index: 10;
    }

    /* Face canvas */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 480px;
      height: 320px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Bottom bar */
    #bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 8px;
      color: #1a6a1a;
      border-top: 1px solid #1a3a1a;
      z-index: 10;
    }

    #status-label {
      color: #3dff4a;
    }

    #wifi {
      color: #1a6a1a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="header">
      <span>Lulu.ai</span>
      <span id="clock">--:--</span>
    </div>
    <canvas id="face" width="480" height="320"></canvas>
    <div id="bottom">
      <span id="status-label">STATUS: IDLE</span>
      <span id="wifi">▂▄▆█</span>
    </div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────────────────────
    const PX = 4;
    const EYE_W  = 7 * PX;   // 28px
    const EYE_H  = 6 * PX;   // 24px
    const EYE_GAP = 7 * PX;  // 28px — gap between eyes
    const FG = '#3dff4a';     // phosphor green
    const BG = '#060d06';     // dark phosphor background

    const W = 480;
    const H = 320;

    // Face center — between header (28px) and bottom bar (28px)
    const CX = W / 2;
    const CY = 28 + Math.round((H - 56) * 0.45);  // 45% of usable area

    const LEFT_EYE_X  = CX - EYE_GAP / 2 - EYE_W / 2;
    const RIGHT_EYE_X = CX + EYE_GAP / 2 + EYE_W / 2;
    const EYE_Y = CY;
    const MOUTH_Y = EYE_Y + EYE_H / 2 + 10;

    // ── Canvas ─────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('face');
    const ctx = canvas.getContext('2d');

    // ── Clock ──────────────────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── Eye draw functions ─────────────────────────────────────────────────────
    function eyeRect(cx, cy, w, h, opacity) {
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      ctx.globalAlpha = 1;
    }

    function drawEyesOpen(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      const h = Math.max(1, Math.round(EYE_H * (1 - blinkFraction)));
      const dy = Math.round((EYE_H - h) / 2);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      ctx.fillRect(lx - EYE_W / 2 + glanceX, ly - EYE_H / 2 + dy, EYE_W, h);
      ctx.fillRect(rx - EYE_W / 2 + glanceX, ry - EYE_H / 2 + dy, EYE_W, h);
      ctx.globalAlpha = 1;
    }

    function drawEyesHalfClosed(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      const baseH = Math.round(EYE_H / 2);
      const h = Math.max(1, Math.round(baseH * (1 - blinkFraction)));
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      ctx.fillRect(lx - EYE_W / 2 + glanceX, ly, EYE_W, h);
      ctx.fillRect(rx - EYE_W / 2 + glanceX, ry, EYE_W, h);
      ctx.globalAlpha = 1;
    }

    function drawEyesWide(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      const w = EYE_W + 2 * PX;
      const h = Math.max(1, Math.round((EYE_H + PX) * (1 - blinkFraction)));
      const dy = Math.round((EYE_H + PX - h) / 2);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      ctx.fillRect(lx - w / 2 + glanceX, ly - (EYE_H + PX) / 2 + dy, w, h);
      ctx.fillRect(rx - w / 2 + glanceX, ry - (EYE_H + PX) / 2 + dy, w, h);
      ctx.globalAlpha = 1;
    }

    function drawEyesSquint(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      // Thin strip — 1 pixel-unit tall, angled inward on inner edge
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      const h = PX;
      // Left eye: narrows on right side (inner)
      ctx.fillRect(lx - EYE_W / 2,            ly, EYE_W,          h);
      ctx.fillRect(lx - EYE_W / 2,            ly - PX, EYE_W - PX, PX); // angled top-inner
      // Right eye: narrows on left side (inner)
      ctx.fillRect(rx - EYE_W / 2,            ry, EYE_W,          h);
      ctx.fillRect(rx - EYE_W / 2 + PX,       ry - PX, EYE_W - PX, PX);
      ctx.globalAlpha = 1;
    }

    function drawEyesHappy(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      // ^u^ arc — top row full width, bottom rows narrow
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      for (let row = 0; row < 3; row++) {
        const w = Math.max(PX, EYE_W - row * PX);
        const xOff = Math.round((EYE_W - w) / 2);
        ctx.fillRect(lx - EYE_W / 2 + xOff, ly - EYE_H / 2 + row * PX, w, PX);
        ctx.fillRect(rx - EYE_W / 2 + xOff, ry - EYE_H / 2 + row * PX, w, PX);
      }
      ctx.globalAlpha = 1;
    }

    function drawEyesDroop(ctx, lx, ly, rx, ry, blinkFraction, glanceX, opacity) {
      ctx.globalAlpha = opacity;
      ctx.fillStyle = FG;
      const w = 2 * PX;
      const h = 2 * PX;
      ctx.fillRect(lx - w / 2, ly + EYE_H / 2 - h, w, h);
      ctx.fillRect(rx - w / 2, ry + EYE_H / 2 - h, w, h);
      ctx.globalAlpha = 1;
    }

    // ── Mouth draw functions ───────────────────────────────────────────────────
    // Smile = ▀████████▀  (corners raised — ends curve UP)
    // Frown = ▄████████▄  (corners lowered)
    // Flat  = horizontal bar

    function drawMouthSmile(ctx, cx, y, opacity) {
      ctx.globalAlpha = opacity ?? 1;
      ctx.fillStyle = FG;
      const mw = 11 * PX; // 44px wide
      ctx.fillRect(cx - mw / 2 + PX, y,      mw - 2 * PX, PX); // center flat
      ctx.fillRect(cx - mw / 2,      y - PX, PX,           PX); // left corner up
      ctx.fillRect(cx + mw / 2 - PX, y - PX, PX,           PX); // right corner up
      ctx.globalAlpha = 1;
    }

    function drawMouthSmileFaint(ctx, cx, y, opacity) {
      drawMouthSmile(ctx, cx, y, (opacity ?? 1) * 0.4);
    }

    function drawMouthSmileWide(ctx, cx, y, opacity) {
      ctx.globalAlpha = opacity ?? 1;
      ctx.fillStyle = FG;
      const mw = 13 * PX; // 52px — wide happy smile
      ctx.fillRect(cx - mw / 2 + PX, y,      mw - 2 * PX, PX);
      ctx.fillRect(cx - mw / 2,      y - PX, PX,           PX);
      ctx.fillRect(cx + mw / 2 - PX, y - PX, PX,           PX);
      ctx.globalAlpha = 1;
    }

    function drawMouthFlat(ctx, cx, y, opacity) {
      ctx.globalAlpha = opacity ?? 1;
      ctx.fillStyle = FG;
      ctx.fillRect(cx - 5 * PX, y, 10 * PX, PX);
      ctx.globalAlpha = 1;
    }

    function drawMouthFrown(ctx, cx, y, opacity) {
      ctx.globalAlpha = opacity ?? 1;
      ctx.fillStyle = FG;
      const mw = 11 * PX;
      ctx.fillRect(cx - mw / 2 + PX, y - PX, mw - 2 * PX, PX); // center raised
      ctx.fillRect(cx - mw / 2,      y,       PX,           PX); // left corner down
      ctx.fillRect(cx + mw / 2 - PX, y,       PX,           PX); // right corner down
      ctx.globalAlpha = 1;
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function drawFace(state, blinkFraction, glanceX, eyeOpacity) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      state.eyes(ctx, LEFT_EYE_X, EYE_Y, RIGHT_EYE_X, EYE_Y, blinkFraction, glanceX, eyeOpacity);
      state.mouth(ctx, CX, MOUTH_Y, eyeOpacity);
    }

    // ── State definitions ──────────────────────────────────────────────────────
    const STATES = {
      idle: {
        label: 'IDLE',
        allowIdle: true,
        speaking: false,
        eyes: drawEyesOpen,
        mouth: drawMouthSmile,
      },
      standby: {
        label: 'STANDBY',
        allowIdle: true,
        speaking: false,
        eyes: drawEyesHalfClosed,
        mouth: drawMouthSmileFaint,
      },
      listening: {
        label: 'LISTENING...',
        allowIdle: false,
        speaking: false,
        eyes: drawEyesWide,
        mouth: drawMouthSmile,
      },
      thinking: {
        label: 'THINKING...',
        allowIdle: false,
        speaking: false,
        eyes: drawEyesSquint,
        mouth: drawMouthFlat,
      },
      speaking: {
        label: 'SPEAKING...',
        allowIdle: false,
        speaking: true,
        eyes: drawEyesHappy,
        mouth: drawMouthSmileWide,
      },
      error: {
        label: 'ERROR',
        allowIdle: false,
        speaking: false,
        eyes: drawEyesDroop,
        mouth: drawMouthFrown,
      },
    };

    // ── Pixel dissolve transition ──────────────────────────────────────────────
    let dissolveAnim = null;

    function pixelDissolve(fromData, toState, blinkFraction, glanceX, eyeOpacity, onDone) {
      const DISSOLVE_MS = 120;

      const off = document.createElement('canvas');
      off.width = W; off.height = H;
      const offCtx = off.getContext('2d');
      offCtx.fillStyle = BG;
      offCtx.fillRect(0, 0, W, H);
      toState.eyes(offCtx, LEFT_EYE_X, EYE_Y, RIGHT_EYE_X, EYE_Y, blinkFraction, glanceX, eyeOpacity);
      toState.mouth(offCtx, CX, MOUTH_Y, eyeOpacity);
      const toData = offCtx.getImageData(0, 0, W, H);

      const pixels = [];
      for (let i = 0; i < W * H; i++) {
        const b = i * 4;
        if (fromData.data[b] !== toData.data[b] ||
            fromData.data[b+1] !== toData.data[b+1] ||
            fromData.data[b+2] !== toData.data[b+2]) {
          pixels.push(i);
        }
      }
      for (let i = pixels.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pixels[i], pixels[j]] = [pixels[j], pixels[i]];
      }

      const work = new ImageData(new Uint8ClampedArray(fromData.data), W, H);
      const total = pixels.length;
      const t0 = performance.now();

      function tick(now) {
        const p = Math.min((now - t0) / DISSOLVE_MS, 1);
        const n = Math.round(p * total);
        for (let i = 0; i < n; i++) {
          const idx = pixels[i] * 4;
          work.data[idx]   = toData.data[idx];
          work.data[idx+1] = toData.data[idx+1];
          work.data[idx+2] = toData.data[idx+2];
          work.data[idx+3] = toData.data[idx+3];
        }
        ctx.putImageData(work, 0, 0);
        if (p < 1) {
          dissolveAnim = requestAnimationFrame(tick);
        } else {
          dissolveAnim = null;
          onDone && onDone();
        }
      }

      if (dissolveAnim) cancelAnimationFrame(dissolveAnim);
      dissolveAnim = requestAnimationFrame(tick);
    }

    // ── Animation state ────────────────────────────────────────────────────────
    let currentState = STATES.idle;
    let transitioning = false;

    let blinkFraction = 0;
    let glanceX = 0;
    let eyeOpacity = 1;

    let nextBlink  = rand(3000, 6000);
    let nextGlance = rand(8000, 15000);
    let blinkActive = false;
    let glanceActive = false;
    let blinkT = 0;
    let glanceT = 0;
    let glanceDir = 0;
    let speakPulseT = 0;
    let lastTime = null;

    function rand(min, max) { return min + Math.random() * (max - min); }

    function animLoop(now) {
      if (!lastTime) lastTime = now;
      const dt = now - lastTime;
      lastTime = now;

      if (!transitioning) {
        const s = currentState;

        if (s.speaking) {
          speakPulseT += dt;
          eyeOpacity = 0.8 + 0.2 * (0.5 + 0.5 * Math.sin((speakPulseT / 600) * Math.PI * 2));
        } else {
          eyeOpacity = 1;
          speakPulseT = 0;
        }

        if (s.allowIdle) {
          nextBlink -= dt;
          if (!blinkActive && nextBlink <= 0) {
            blinkActive = true;
            blinkT = 0;
            nextBlink = s === STATES.standby ? rand(6000, 10000) : rand(3000, 6000);
          }
          if (blinkActive) {
            blinkT += dt;
            const half = 75;
            if (blinkT < half) {
              blinkFraction = blinkT / half;
            } else if (blinkT < half * 2) {
              blinkFraction = 1 - (blinkT - half) / half;
            } else {
              blinkFraction = 0;
              blinkActive = false;
            }
          }

          nextGlance -= dt;
          if (!glanceActive && nextGlance <= 0) {
            glanceActive = true;
            glanceT = 0;
            glanceDir = Math.random() < 0.5 ? -2 * PX : 2 * PX;
            nextGlance = rand(8000, 15000);
          }
          if (glanceActive) {
            glanceT += dt;
            const GI = 100, GH = 1000, GO = 100, GT = GI + GH + GO;
            if (glanceT < GI) {
              glanceX = glanceDir * (glanceT / GI);
            } else if (glanceT < GI + GH) {
              glanceX = glanceDir;
            } else if (glanceT < GT) {
              glanceX = glanceDir * (1 - (glanceT - GI - GH) / GO);
            } else {
              glanceX = 0;
              glanceActive = false;
            }
          }
        } else {
          blinkFraction = 0;
          glanceX = 0;
          blinkActive = false;
          glanceActive = false;
        }

        drawFace(s, blinkFraction, Math.round(glanceX), eyeOpacity);
      }

      requestAnimationFrame(animLoop);
    }

    // ── State transitions ──────────────────────────────────────────────────────
    function transitionTo(newState) {
      if (newState === currentState && !transitioning) return;
      const fromData = ctx.getImageData(0, 0, W, H);
      transitioning = true;
      blinkFraction = 0; glanceX = 0;
      blinkActive = false; glanceActive = false;

      pixelDissolve(fromData, newState, 0, 0, 1, () => {
        currentState = newState;
        transitioning = false;
        nextBlink  = rand(3000, 6000);
        nextGlance = rand(8000, 15000);
      });

      document.getElementById('status-label').textContent = 'STATUS: ' + newState.label;
    }

    // ── WebSocket ──────────────────────────────────────────────────────────────
    const STATE_MAP = {
      idle: STATES.idle, standby: STATES.standby, listening: STATES.listening,
      thinking: STATES.thinking, speaking: STATES.speaking, error: STATES.error,
    };

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws`);
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status' && STATE_MAP[msg.value]) transitionTo(STATE_MAP[msg.value]);
        } catch (_) {}
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
      ws.onerror = () => ws.close();
    }

    // ── CSS scaling ────────────────────────────────────────────────────────────
    function applyScale() {
      const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
      document.getElementById('stage').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', applyScale);
    applyScale();

    // ── Boot ───────────────────────────────────────────────────────────────────
    drawFace(STATES.idle, 0, 0, 1);
    requestAnimationFrame(animLoop);
    connectWS();
  </script>
</body>
</html>
